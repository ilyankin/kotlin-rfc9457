name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, ABI, docs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Compiles every target, runs the suites this host can, and checks both ABI dumps.
      - name: Build
        run: ./gradlew build

      # Kover instruments each module's tests (`rfc9457.kmp-library`); the root is the merging
      # module (`kover(project(...))` in the root build file) that combines them all into one
      # report. Not part of `build`/`check`, so it needs its own invocation.
      - name: Generate coverage report
        run: ./gradlew :koverXmlReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml

      # Dokka is deliberately off `check`: it needs network access and the local build must work
      # offline. CI is the only place `reportUndocumented` + `failOnWarning` can gate a PR.
      - name: Generate documentation
        run: ./gradlew dokkaGenerate

      # `failOnWarning` proves KDoc exists, not that its links resolve: Dokka renders an unresolved
      # `[Link]` as plain text and stays green. Checked on the aggregate, which is where
      # cross-module links are supposed to resolve.
      - name: Check for unresolved KDoc links
        run: |
          set -euo pipefail
          unresolved=$(grep -rho 'data-unresolved-link="[^"]*"' build/dokka/html | sort -u || true)
          if [ -n "$unresolved" ]; then
            echo "Unresolved KDoc links in the aggregated documentation:"
            echo "$unresolved"
            exit 1
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-linux
          path: '**/build/reports/tests/'
          retention-days: 7

  test-apple:
    # Apple targets compile on any host. Running their tests takes a macOS arm64 machine, which is
    # what this job provides.
    name: Apple targets
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cache keys carry the runner OS, and entries never cross between operating systems
      # (gradle/actions#27, closed as won't-do). No Linux job can seed a macOS entry, so this one
      # has to write its own or start cold on every run forever.
      - uses: ./.github/actions/setup
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # `gradle.properties` is tuned for a workstation. This is the smallest runner in the fleet
      # (3 CPU / 7 GB), where its 4g + 3g of daemon heap would ask for the whole machine before the
      # OS, the test binaries and the simulator get any.
      - name: Test
        run: >-
          ./gradlew macosArm64Test iosSimulatorArm64Test --max-workers=2
          -Dorg.gradle.jvmargs=-Xmx2g
          -Dkotlin.daemon.jvmargs=-Xmx3g

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-apple
          path: '**/build/reports/tests/'
          retention-days: 7

  test-windows:
    # `mingwX64` is tier 3 and its tests run on Windows, which is why this repository keeps a
    # Windows runner.
    name: Windows target
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Its own entry, for the same reason as the Apple job above.
      - uses: ./.github/actions/setup
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Test
        run: ./gradlew mingwX64Test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-windows
          path: '**/build/reports/tests/'
          retention-days: 7

  isolated-projects:
    # Isolated Projects compatibility is a property this build is built around; only CI catches the
    # regression that breaks it. See docs/gradle-build-structure.md.
    name: Isolated Projects
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # This job shares the Linux key space with `build`, which is the one that writes there.
          # Two writers would race for a single entry.
          cache-read-only: true

      - name: Build with Isolated Projects
        run: ./gradlew build -Dorg.gradle.isolated-projects=true

  dependency-graph:
    # Submits the resolved graph so Dependabot alerts cover transitive dependencies, not just what
    # `libs.versions.toml` declares.
    name: Dependency graph
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      # Test-only classpaths never ship, so a transitive CVE there is never reachable from a
      # consumer — excluded so Dependabot alerts stay scoped to what's actually shippable. KMP
      # qualifies these per target (`jvmTestCompileClasspath`), not the plain `testCompileClasspath`
      # a single-platform project would have.
      - uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph-exclude-configurations: '.*[Tt]est(Compile|Runtime)Classpath'
