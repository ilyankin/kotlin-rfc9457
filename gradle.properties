org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

# Before the convention-plugin migration, `build --configuration-cache` passed while
# `publishToMavenLocal --configuration-cache` failed — publish tasks aren't in the `build` graph, so
# the defect was invisible to the command anyone actually runs. On since then.
org.gradle.configuration-cache=true

# Single source of truth for the coordinates (docs/release-strategy.md governs them); all four
# modules always share one version, since drifting apart is what a BOM exists to prevent (JLBP-15).
#
# First release is 0.1.0 — plain 0.x, not a 1.0.0-beta/-RC, since both of those are pre-releases *of*
# 1.0 and would announce a frozen surface. 0.y.z is the honest state until someone outside this repo
# has used it.
group=io.github.ilyankin
version=0.1.0-SNAPSHOT
