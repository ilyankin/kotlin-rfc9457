org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

org.gradle.configuration-cache=true

# Gradle defaults to a 512 MiB heap and 384 MiB of metaspace, which this target set outgrows.
# Without the Kotlin daemon setting the JS compiler is the first thing to fail. Below 4g a full
# `build` stops the Gradle daemon with "the JVM garbage collector is thrashing". Both fit inside a
# 16 GB GitHub runner together.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx3g

group=io.github.ilyankin
version=0.7.0-SNAPSHOT
